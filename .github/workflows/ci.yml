name: Evidence integrity and regression tests
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Qollab browser entrypoint syntax
        run: node --input-type=module --check < qollab/main.js
      - name: Reviewer module syntax
        run: node --check reviewer/verifier.mjs
      - name: Independent forensic regression suite
        run: node --test tests/*.test.mjs
